<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Pontinhos</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <h1>O Jogo dos Pontinhos</h1>

        <div class="placar">
            <p>Jogador 1: <span id="pontos-j1">0</span></p>
            <p id="vez">Vez do Jogador 1</p>
            <p>Jogador 2: <span id="pontos-j2">0</span></p>
        </div>

        <div id="tabuleiro">

            <!-- Linha 1 -->
            <div class="linha-horizontal">
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
            </div>

            <!-- Ligações verticais -->
            <div class="linha-vertical">
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
            </div>

            <!-- Linha 2 -->
            <div class="linha-horizontal">
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
            </div>

            <!-- Ligações verticais -->
            <div class="linha-vertical">
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
            </div>

            <!-- Linha 3 -->
            <div class="linha-horizontal">
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
            </div>

            <!-- Ligações verticais -->
            <div class="linha-vertical">
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
                <div class="espaco"></div>
                <div class="ligacao vertical"></div>
            </div>

            <!-- Linha 4 -->
            <div class="linha-horizontal">
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
                <div class="ligacao horizontal"></div>
                <div class="ponto"></div>
            </div>
        </div>      
    </main>
    <script src="script.js"></script>
</body>
</html>
