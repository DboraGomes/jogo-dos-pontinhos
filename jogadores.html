<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomes dos jogadores</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section id="tela-jogadores">

        <div class="moldura-jogadores">
            <img src="/assets/imgs/quemjoga.png" alt="Quem vai jogar?" class="logo-jogadores">

            <div class="campos-jogadores">
                <p class="texto-jogadores">Digite o nome dos dois jogadores e prepare-se para a partida!</p>

                <label for="nome-jogador1">Jogador 1</label>
                <input type="text" id="nome-jogador1" placeholder="Digite seu nome...">

                <label for="nome-jogador2">Jogador 2</label>
                <input type="text" id="nome-jogador2" placeholder="Digite seu nome...">

                <button id="btn-comecar">Começar</button>

            </div>

            <img src="./assets/imgs/redoma.png" alt="" class="redoma">
            <img src="./assets/imgs/espelho.png" alt="" class="espelho">

        </div>
    </section>

    <script src="./script.js"></script>
</body>
</html>
