<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Pontinhos</title>
    <link rel="stylesheet" href="./style.css">
</head>

    <body>
        <section id="tela-jogo">

            <div class="moldura-jogo">
                <img src="./assets/imgs/logo.png" alt="Jogo dos Pontinhos" class="logo-jogo">

                <div class="placar">
                    <p>
                        <span id="nome-j1">Jogador 1</span>:
                        <span id="pontos-j1">0</span>
                    </p>

                    <p id="vez">Vez do Jogador 1</p>

                    <p>
                        <span id="nome-j2">Jogador 2</span>:
                        <span id="pontos-j2">0</span>
                    </p>
                </div>

                <div id="tabuleiro"></div>

                <img src="./assets/imgs/redoma.png" alt="" class="redoma">
                <img src="./assets/imgs/espelho.png" alt="" class="espelho">

            </div>
        </section>

        <script src="./script.js"></script>

    </body>
</html>
